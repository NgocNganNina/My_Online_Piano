<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Piano Connect Web</title>
    <!-- Cursive Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03010A;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        /* Canvas layered background */
        #galaxy-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Main UI Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Cursive Title Style */
        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 5rem;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 2px;
            margin-bottom: 2.5rem;
            text-align: center;
            background: linear-gradient(135deg, #ff71ce, #b967ff, #8240ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(255, 113, 206, 0.8)) 
                    drop-shadow(0 0 25px rgba(185, 103, 255, 0.6));
        }

        .portals-wrapper {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 80%;
            max-width: 1100px;
            gap: 2rem;
        }

        .portal-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.4s ease;
        }

        .portal-card:hover {
            transform: scale(1.08);
        }

        .portal-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 10px rgba(216, 180, 254, 0.9), 0 0 20px rgba(168, 85, 247, 0.6);
            background: linear-gradient(180deg, #ffffff, #e9d5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Swirling Cosmic Portal Styling */
        .portal-ring {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.9) 0%, rgba(76, 29, 149, 0.8) 40%, rgba(15, 23, 42, 1) 70%);
            box-shadow: 
                0 0 30px rgba(168, 85, 247, 0.8),
                0 0 60px rgba(126, 34, 206, 0.6),
                inset 0 0 25px rgba(236, 72, 153, 0.8);
            cursor: pointer;
            overflow: hidden;
        }

        .portal-ring::before {
            content: '';
            position: absolute;
            width: 140%;
            height: 140%;
            background: conic-gradient(from 0deg, transparent, rgba(192, 132, 252, 0.8), rgba(236, 72, 153, 0.8), transparent 60%);
            animation: spin 4s linear infinite;
            border-radius: 40%;
        }

        .portal-ring::after {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #090214 40%, rgba(88, 28, 135, 0.8) 80%, transparent 100%);
            border-radius: 50%;
            box-shadow: inset 0 0 20px rgba(192, 132, 252, 0.9);
        }

        .portal-core {
            position: relative;
            z-index: 2;
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 25px #ffffff, 0 0 50px #c084fc, 0 0 75px #a855f7;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        .portal-card:hover .portal-core {
            transform: scale(1.2);
            box-shadow: 0 0 35px #ffffff, 0 0 70px #f472b6, 0 0 100px #c084fc;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .portals-wrapper {
                flex-direction: column;
                gap: 3rem;
            }
            .title {
                font-size: 3.2rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="galaxy-canvas"></canvas>

    <div class="container">
        <h1 class="title">The Piano Connect Web</h1>

        <div class="portals-wrapper">
            <!-- Portal 1 -->
            <a href="The Galaxy Piano.html" class="portal-card">
                <div class="portal-title">The Galaxy Piano</div>
                <div class="portal-ring">
                    <div class="portal-core"></div>
                </div>
            </a>

            <!-- Portal 2 -->
            <a href="The Harmonic Vibrating Piano.html" class="portal-card">
                <div class="portal-title">The Harmonic Vibrating Piano</div>
                <div class="portal-ring">
                    <div class="portal-core"></div>
                </div>
            </a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('galaxy-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Starfield background
        const stars = [];
        const numStars = 350;
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        // SVG Path definitions for shiny vector musical notes
        const notePaths = [
            new Path2D('M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z'),
            new Path2D('M9 3v10.55A4 4 0 1 0 11 17V7h6v6.55A4 4 0 1 0 19 17V3H9z')
        ];

        // Flying Musical Notes
        const notes = [];
        const numNotes = 22;

        for (let i = 0; i < numNotes; i++) {
            notes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                path: notePaths[Math.floor(Math.random() * notePaths.length)],
                scale: Math.random() * 1.2 + 0.8,
                speedX: (Math.random() - 0.3) * 1.2,
                speedY: -(Math.random() * 1.5 + 0.5),
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.03,
                opacity: Math.random() * 0.7 + 0.3,
                glowColor: Math.random() > 0.5 ? '#ff71ce' : '#c084fc'
            });
        }

        // Nebula cloud background generation
        function drawNebula() {
            const gradient1 = ctx.createRadialGradient(
                canvas.width * 0.3, canvas.height * 0.4, 50,
                canvas.width * 0.3, canvas.height * 0.4, canvas.width * 0.6
            );
            gradient1.addColorStop(0, 'rgba(88, 28, 135, 0.35)');
            gradient1.addColorStop(0.5, 'rgba(49, 16, 122, 0.15)');
            gradient1.addColorStop(1, 'rgba(3, 1, 10, 0)');

            const gradient2 = ctx.createRadialGradient(
                canvas.width * 0.7, canvas.height * 0.6, 50,
                canvas.width * 0.7, canvas.height * 0.6, canvas.width * 0.5
            );
            gradient2.addColorStop(0, 'rgba(192, 38, 211, 0.25)');
            gradient2.addColorStop(0.5, 'rgba(76, 29, 149, 0.12)');
            gradient2.addColorStop(1, 'rgba(3, 1, 10, 0)');

            ctx.fillStyle = gradient1;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = gradient2;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Animation Loop
        function animate() {
            ctx.fillStyle = '#03010A';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawNebula();

            // Render Stars
            ctx.fillStyle = '#FFFFFF';
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                ctx.globalAlpha = Math.abs(star.alpha);
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Render Flying Musical Notes
            notes.forEach(note => {
                ctx.save();
                ctx.translate(note.x, note.y);
                ctx.rotate(note.rotation);
                ctx.scale(note.scale, note.scale);

                ctx.shadowColor = note.glowColor;
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#FFFFFF';
                ctx.globalAlpha = note.opacity;

                ctx.fill(note.path);
                ctx.restore();

                note.x += note.speedX;
                note.y += note.speedY;
                note.rotation += note.rotSpeed;

                if (note.y < -50) {
                    note.y = canvas.height + 50;
                    note.x = Math.random() * canvas.width;
                }
                if (note.x < -50) note.x = canvas.width + 50;
                if (note.x > canvas.width + 50) note.x = -50;
            });

            ctx.globalAlpha = 1.0;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
