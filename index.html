<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmony — Online Piano</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond…0;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#1a1510;--fg:#f5ede0;--muted:#8a7e6b;--accent:#c9a84c;--card:#2a2318;--border:#3d3428}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Cormorant Garamond',serif}
.amb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.11;pointer-events:none;z-index:0}
.a1{width:340px;height:340px;background:#c9a84c;top:4%;left:6%;animation:bf 22s ease-in-out infinite alternate}
.a2{width:260px;height:260px;background:#8b5a2b;top:52%;right:8%;animation:bf 28s ease-in-out infinite alternate-reverse}
.a3{width:200px;height:200px;background:#d4a76a;bottom:12%;left:32%;animation:bf 32s ease-in-out infinite alternate;animation-delay:-9s}
@keyframes bf{0%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-18px) scale(1.1)}100%{transform:translate(-18px,14px) scale(.94)}}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;background:rgba(26,21,16,.88);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:700;color:var(--accent);letter-spacing:2px}
.mtabs{display:flex;gap:3px;flex-wrap:wrap}
.mtabs button{background:0;color:var(--muted);border:1px solid transparent;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.82rem;font-family:'Source Sans 3',sans-serif;transition:all .2s}
.mtabs button:hover{color:var(--fg);background:rgba(201,168,76,.08)}
.mtabs button.act{color:var(--accent);border-color:var(--accent);background:rgba(201,168,76,.1)}
.cg{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cg label{color:var(--muted);font-size:.78rem}
.cg select,.cg button{background:var(--card);color:var(--fg);border:1px solid var(--border);padding:4px 9px;border-radius:6px;font-size:.78rem;cursor:pointer;font-family:'Source Sans 3',sans-serif}
.cg select:focus,.cg button:focus{outline:0;border-color:var(--accent)}
.ob{width:26px;height:26px;display:flex;align-items:center;justify-content:center;padding:0!important;font-size:.85rem!important}
main{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px 8px;overflow-x:auto}
.pw{transform-origin:top center}
.pb{background:linear-gradient(180deg,#2a1f14,#1e1812 30%,#1a1410);border:2px solid #3d2e1e;border-radius:10px 10px 14px 14px;box-shadow:0 12px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(201,168,76,.15),0 0 80px rgba(201,168,76,.04);padding:16px 16px 26px;position:relative}
.pb::before{content:'';position:absolute;top:-1px;left:18px;right:18px;height:3px;background:linear-gradient(90deg,transparent,#c9a84c,#e8d5a0,#c9a84c,transparent);border-radius:3px}
.ka{position:relative;display:flex}
#fxC{position:absolute;top:0;left:0;pointer-events:none;z-index:10}
.wk{width:46px;height:178px;background:linear-gradient(180deg,#f8f4ec,#f0ece4 55%,#e8e4dc);border:1px solid #c8c3b8;border-top:0;border-radius:0 0 5px 5px;box-shadow:0 5px 8px rgba(0,0,0,.15),inset 0 -3px 4px rgba(0,0,0,.04),-1px 0 0 rgba(0,0,0,.08),1px 0 0 rgba(0,0,0,.08);position:relative;cursor:pointer;transition:transform .04s,box-shadow .04s,background .04s;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7px;user-select:none;flex-shrink:0}
.wk:hover:not(.act){background:linear-gradient(180deg,#f2eee6,#eae6de 55%,#e2ded6);box-shadow:0 3px 5px rgba(0,0,0,.12)}
.wk.act{transform:translateY(3px);box-shadow:0 2px 3px rgba(0,0,0,.2),inset 0 1px 3px rgba(0,0,0,.08);background:linear-gradient(180deg,#ece8e0,#e4e0d8)}
.wk.hl{background:linear-gradient(180deg,rgba(201,168,76,.38),rgba(201,168,76,.18))!important;box-shadow:0 0 20px rgba(201,168,76,.35),0 4px 8px rgba(0,0,0,.15)!important}
.bk{width:30px;height:115px;background:linear-gradient(180deg,#303030,#1a1a1a 35%,#111);border-radius:0 0 4px 4px;box-shadow:0 5px 10px rgba(0,0,0,.45),inset 0 -4px 5px rgba(0,0,0,.3),inset 0 1px 2px rgba(255,255,255,.08);position:absolute;top:0;z-index:2;cursor:pointer;transition:transform .04s,box-shadow .04s,height .04s;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;user-select:none}
.bk:hover:not(.act){background:linear-gradient(180deg,#383838,#222 35%,#181818)}
.bk.act{transform:translateY(3px);height:112px;box-shadow:0 2px 4px rgba(0,0,0,.35),inset 0 1px 2px rgba(255,255,255,.05)}
.bk.hl{background:linear-gradient(180deg,rgba(201,168,76,.55),rgba(201,168,76,.35))!important;box-shadow:0 0 18px rgba(201,168,76,.4)!important}
.kl{font-size:.58rem;font-weight:600;opacity:.42;pointer-events:none;text-transform:uppercase;line-height:1}
.wk .kl{color:#5a5347}.bk .kl{color:rgba(255,255,255,.38)}
.ks{font-size:7px;pointer-events:none;animation:sp 2.5s ease-in-out infinite;margin-top:2px}
.wk .ks{color:rgba(201,168,76,.45)}.bk .ks{color:rgba(255,255,255,.3)}
@keyframes sp{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:.8;transform:scale(1.25)}}
#panel{padding:14px 24px;min-height:120px;max-height:220px;overflow-y:auto;border-top:1px solid var(--border);background:rgba(26,21,16,.6);backdrop-filter:blur(8px)}
#panel::-webkit-scrollbar{width:5px}#panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
footer{padding:9px 24px 14px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;border-top:1px solid var(--border);background:rgba(26,21,16,.8);backdrop-filter:blur(8px)}
.rb{padding:5px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--fg);cursor:pointer;font-size:.8rem;font-family:'Source Sans 3',sans-serif;transition:all .2s;display:flex;align-items:center;gap:5px}
.rb:hover{border-color:var(--accent);color:var(--accent)}.rb:disabled{opacity:.35;cursor:default}
.rb.rec{border-color:#e74c3c;color:#e74c3c;animation:rb 1s ease-in-out infinite}
@keyframes rb{0%,100%{opacity:1}50%{opacity:.5}}
.rt{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums;min-width:46px}
.sb{display:flex;gap:3px}.sb button{padding:2px 7px;border-radius:4px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:.72rem;font-family:'Source Sans 3',sans-serif;transition:all .15s}.sb button.act{color:var(--accent);border-color:var(--accent)}
.sl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:all .2s}
.sc:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.sc.pl{border-color:var(--accent);background:rgba(201,168,76,.08)}
.sc h3{font-size:.95rem;font-weight:600;color:var(--fg);margin-bottom:3px}.sc p{font-size:.72rem;color:var(--muted)}
.gp{text-align:center}.gp .gs{font-size:1.9rem;font-family:'Cormorant Garamond',serif;color:var(--accent);font-weight:700}
.gp .gr{color:var(--muted);font-size:.85rem}.gp .gst{font-size:1rem;margin:10px 0;min-height:26px}
.gp .sd{display:flex;gap:5px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.gp .dt{width:13px;height:13px;border-radius:50%;border:2px solid var(--border);transition:all .2s}
.gp .dt.ok{background:#27ae60;border-color:#27ae60}.gp .dt.no{background:#e74c3c;border-color:#e74c3c}.gp .dt.cur{border-color:var(--accent);box-shadow:0 0 8px rgba(201,168,76,.25)}
.cp .nl{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0;max-height:70px;overflow-y:auto;padding:7px;background:rgba(0,0,0,.2);border-radius:6px}
.cp .nt{padding:2px 7px;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.3);border-radius:4px;font-size:.68rem;color:var(--accent)}
.lp h3{color:var(--accent);font-size:1.15rem;margin-bottom:7px}.lp p{color:var(--fg);font-size:.88rem;line-height:1.55;margin-bottom:8px}
.lp .ln{display:flex;gap:7px;justify-content:flex-end;margin-top:10px}
.lp button{padding:5px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--fg);cursor:pointer;font-size:.8rem;font-family:'Source Sans 3',sans-serif;transition:all .2s}
.lp button:hover{border-color:var(--accent);color:var(--accent)}.lp button:disabled{opacity:.3;cursor:default}
.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%) translateY(18px);padding:9px 22px;border-radius:8px;font-size:.83rem;z-index:100;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.suc{background:rgba(39,174,96,.92);color:#fff}.toast.err{background:rgba(231,76,60,.92);color:#fff}.toast.inf{background:rgba(201,168,76,.92);color:#1a1510}
.pgb{width:100%;height:4px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}.pgb .fl{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
@media(prefers-reduced-motion:reduce){.amb,.ks{animation:none!important}.wk,.bk{transition:none!important}}
@media(max-width:1100px){.pw{transform:scale(.7)}}
@media(max-width:800px){.pw{transform:scale(.5)}header{padding:8px 12px}.mtabs button{padding:3px 7px;font-size:.72rem}}
</style>
</head>
<body>
<div class="amb a1"></div><div class="amb a2"></div><div class="amb a3"></div>
<div id="app">
<header>
  <div class="logo">Harmony</div>
  <nav class="mtabs" id="mt">
    <button class="act" data-m="free"><i class="fas fa-music"></i> Free Play</button>
    <button data-m="songs"><i class="fas fa-list"></i> Songs</button>
    <button data-m="game"><i class="fas fa-gamepad"></i> Mini-Game</button>
    <button data-m="compose"><i class="fas fa-pen-nib"></i> Compose</button>
    <button data-m="lessons"><i class="fas fa-graduation-cap"></i> Lessons</button>
  </nav>
  <div class="cg">
    <label>Effect:</label>
    <select id="efx">
      <option value="none">None</option><option value="fireworks">Fireworks</option><option value="hearts">Hearts</option>
      <option value="diamonds">Diamonds</option><option value="shootingstars">Shooting Stars</option><option value="random">Random</option>
      <option value="bubbles">Bubbles</option><option value="leaves">Autumn Leaves</option><option value="rain">Raindrops</option>
      <option value="snow">Snowflakes</option><option value="notes">Musical Notes</option><option value="butterflies">Butterflies</option>
      <option value="fireflies">Fireflies</option><option value="blossoms">Cherry Blossoms</option><option value="ripples">Water Ripples</option>
      <option value="sparkles">Sparkles</option><option value="flames">Flames</option><option value="stars">Golden Stars</option>
    </select>
    <label>Octave:</label>
    <button class="ob" id="oD"><i class="fas fa-chevron-left"></i></button>
    <span id="oL" style="color:var(--accent);font-size:.82rem;min-width:56px;text-align:center">C3 – B5</span>
    <button class="ob" id="oU"><i class="fas fa-chevron-right"></i></button>
  </div>
</header>
<main><div class="pw"><div class="pb"><div class="ka" id="ka"><canvas id="fxC"></canvas></div></div></div></main>
<section id="panel"></section>
<footer>
<button class="rb" id="recB"><i class="fas fa-circle" style="font-size:.55rem;color:#e74c3c"></i> Record</button>
  <span class="rt" id="recT">00:00</span>
  <button class="rb" id="revB" disabled><i class="fas fa-play"></i> Review</button>
  <div class="sb" id="spB" style="display:none">
    <button data-s="0.5">0.5x</button><button data-s="1" class="act">1x</button><button data-s="2">2x</button><button data-s="4">4x</button>
  </div>
  <button class="rb" id="clrB" disabled><i class="fas fa-trash"></i> Clear</button>
</footer>
</div>
<div class="toast" id="toast"></div>
<script>
// ===== CONSTANTS =====
const NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const BPOS=[0,1,3,4,5],BIDX=[1,3,6,8,10];
const WW=46,WH=178,BW=30,BH=115;
const EF=['fireworks','hearts','diamonds','shootingstars','bubbles','leaves','rain','snow','notes','butterflies','fireflies','blossoms','ripples','sparkles','flames','stars'];
const KBM={z:{o:0,n:0},s:{o:0,n:1},x:{o:0,n:2},d:{o:0,n:3},c:{o:0,n:4},v:{o:0,n:5},g:{o:0,n:6},b:{o:0,n:7},h:{o:0,n:8},n:{o:0,n:9},j:{o:0,n:10},m:{o:0,n:11},q:{o:1,n:0},'2':{o:1,n:1},w:{o:1,n:2},'3':{o:1,n:3},e:{o:1,n:4},r:{o:1,n:5},'5':{o:1,n:6},t:{o:1,n:7},'6':{o:1,n:8},y:{o:1,n:9},'7':{o:1,n:10},u:{o:1,n:11},i:{o:2,n:0},'9':{o:2,n:1},o:{o:2,n:2},'0':{o:2,n:3},p:{o:2,n:4},a:{o:1,n:0}};
const M2K={};
Object.entries(KBM).forEach(([k,v])=>{const m=(3+v.o+1)*12+v.n;if(!M2K[m])M2K[m]=[];M2K[m].push(k.toUpperCase())});

// ===== STATE =====
let bO=3,cMode='free',cEfx='none',aCtx=null,keys=[],aK=new Set(),parts=[];
let rec=[],isRec=false,rStart=0,rTmr=null,revSpd=1,isRev=false,songPl=null,sTO=[];
let gS={seq:[],inp:[],rnd:0,score:0,lis:false,started:false};
let cNotes=[],isComp=false,lesIdx=0;

// ===== AUDIO =====
function ensA(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();if(aCtx.state==='suspended')aCtx.resume()}
function playN(midi,dur=1.8){
  ensA();const f=440*Math.pow(2,(midi-69)/12),n=aCtx.currentTime;
  if(!window._c){window._c=aCtx.createDynamicsCompressor();window._c.connect(aCtx.destination)}
  const m=aCtx.createGain();m.connect(window._c);
  m.gain.setValueAtTime(0,n);m.gain.linearRampToValueAtTime(.22,n+.006);
  m.gain.setTargetAtTime(.10,n+.006,.08);m.gain.setTargetAtTime(.0001,n+dur*.6,dur*.25);
  [{r:1,g:1},{r:2,g:.45},{r:3,g:.18},{r:4,g:.07},{r:5,g:.03},{r:6,g:.015}].forEach(p=>{
    const o=aCtx.createOscillator(),g=aCtx.createGain();
    o.type=midi<45?'triangle':'sine';o.frequency.setValueAtTime(Math.max(20,f*p.r),n);
    o.detune.setValueAtTime((Math.random()-.5)*3,n);g.gain.setValueAtTime(p.g*.18,n);
    g.gain.setTargetAtTime(.0001,n+dur*.4,dur*.2);o.connect(g);g.connect(m);o.start(n);o.stop(n+dur)
  })
}

// ===== BUILD PIANO =====
const ka=document.getElementById('ka'),fxC=document.getElementById('fxC'),fc=fxC.getContext('2d');
function isB(m){return[1,3,6,8,10].includes(m%12)}
function mN(m){return NN[m%12]+(Math.floor(m/12)-1)}
function fK(m){return keys.find(k=>k.m===m)}
function buildP(){
  ka.querySelectorAll('.wk,.bk').forEach(e=>e.remove());keys=[];
  const sM=(bO+1)*12,eM=sM+36;let wc=0;
  // White keys
  for(let m=sM;m<eM;m++){if(!isB(m)){
    const el=document.createElement('div');el.className='wk';el.dataset.midi=m;
    const lb=M2K[m]||[];el.innerHTML=`<span class="kl">${lb.join('/')||''}</span><span class="ks">★</span>`;
    ka.appendChild(el);keys.push({m,el,ib:false,x:wc*WW,y:0,w:WW,h:WH});wc++
  }}
  // Black keys
  let wi=0;
  for(let oc=0;oc<3;oc++){const oM=sM+oc*12;
    BPOS.forEach((pos,i)=>{const m=oM+BIDX[i];if(m<eM){
      const el=document.createElement('div');el.className='bk';el.dataset.midi=m;
      const lb=M2K[m]||[];el.innerHTML=`<span class="kl">${lb.join('/')||''}</span><span class="ks">★</span>`;
      const left=(wi+pos+1)*WW-BW/2;el.style.left=left+'px';
      ka.appendChild(el);keys.push({m,el,ib:true,x:left,y:0,w:BW,h:BH})
    }});wi+=7
  }
  fxC.width=wc*WW;fxC.height=WH;fxC.style.width=fxC.width+'px';fxC.style.height=fxC.height+'px';
  document.getElementById('oL').textContent=`C${bO} – B${bO+2}`;
  keys.forEach(k=>{
    k.el.addEventListener('mousedown',e=>{e.preventDefault();trig(k.m,true)});
    k.el.addEventListener('mouseup',()=>trig(k.m,false));
    k.el.addEventListener('mouseleave',()=>{if(aK.has(k.m))trig(k.m,false)});
    k.el.addEventListener('touchstart',e=>{e.preventDefault();trig(k.m,true)},{passive:false});
    k.el.addEventListener('touchend',e=>{e.preventDefault();trig(k.m,false)})
  })
}

// ===== INPUT =====
function trig(midi,down){
  const k=fK(midi);if(!k)return;
  if(down&&!aK.has(midi)){
    aK.add(midi);k.el.classList.add('act');playN(midi);spEfx(k);
    if(isRec)rec.push({midi,time:Date.now()-rStart});
    if(isComp)cNotes.push({midi,time:Date.now()-rStart});
    if(cMode==='game'&&!gS.lis&&gS.started)gInput(midi);
    if(cMode==='lessons')chkLes(midi)
  }else if(!down&&aK.has(midi)){aK.delete(midi);k.el.classList.remove('act')}
}
const pKB=new Set();
document.addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();
  if(KBM[k]&&!pKB.has(k)){pKB.add(k);trig((bO+KBM[k].o+1)*12+KBM[k].n,true)}});
document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();
  if(KBM[k]){pKB.delete(k);trig((bO+KBM[k].o+1)*12+KBM[k].n,false)}});
document.getElementById('oD').onclick=()=>{if(bO>0){bO--;stopAll();buildP()}};
document.getElementById('oU').onclick=()=>{if(bO<6){bO++;stopAll();buildP()}};
function stopAll(){aK.forEach(m=>{const k=fK(m);if(k)k.el.classList.remove('act')});aK.clear();pKB.clear();
  sTO.forEach(t=>clearTimeout(t));sTO=[];songPl=null}

// ===== PARTICLES =====
class P{
  constructor(x,y,c){this.x=x;this.y=y;this.vx=c.vx||0;this.vy=c.vy||0;this.sz=Math.max(1,c.sz||5);
    this.col=c.col||'#c9a84c';this.a=c.a||1;this.dc=c.dc||.02;this.g=c.g||0;this.l=1;
    this.sh=c.sh||'c';this.rot=c.rot||0;this.rs=c.rs||0;this.wb=c.wb||0;this.ws=c.ws||0;this.t=0}
up(){this.t++;this.x+=this.vx+(this.wb?Math.sin(this.t*this.ws)*this.wb:0);this.y+=this.vy;
    this.vy+=this.g;this.l-=this.dc;this.a=Math.max(0,this.l);this.rot+=this.rs;return this.l>0}
  dr(ctx){ctx.save();ctx.globalAlpha=this.a;ctx.translate(this.x,this.y);ctx.rotate(this.rot);
    ctx.fillStyle=this.col;const s=this.sz;
    switch(this.sh){
      case'c':ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);ctx.fill();break;
      case'h':ctx.beginPath();ctx.moveTo(0,s*.3);ctx.bezierCurveTo(0,0,-s*.5,0,-s*.5,s*.3);
        ctx.bezierCurveTo(-s*.5,s*.6,0,s*.8,0,s);ctx.bezierCurveTo(0,s*.8,s*.5,s*.6,s*.5,s*.3);
        ctx.bezierCurveTo(s*.5,0,0,0,0,s*.3);ctx.fill();break;
      case'd':ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.6,0);ctx.lineTo(0,s);ctx.lineTo(-s*.6,0);ctx.closePath();ctx.fill();break;
      case's':ctx.beginPath();for(let i=0;i<5;i++){const a=i*4*Math.PI/5-Math.PI/2;
        if(i===0)ctx.moveTo(Math.cos(a)*s,Math.sin(a)*s);
        else{const a0=(i-1)*4*Math.PI/5-Math.PI/2;ctx.lineTo(Math.cos((a0+a)/2)*s*.4,Math.sin((a0+a)/2)*s*.4);ctx.lineTo(Math.cos(a)*s,Math.sin(a)*s)}}
        ctx.closePath();ctx.fill();break;
      case'l':ctx.beginPath();ctx.moveTo(0,-s);ctx.bezierCurveTo(s*.8,-s*.5,s*.8,s*.5,0,s);
        ctx.bezierCurveTo(-s*.8,s*.5,-s*.8,-s*.5,0,-s);ctx.fill();break;
      case'sn':ctx.strokeStyle=this.col;ctx.lineWidth=1.5;for(let i=0;i<6;i++){const a=i*Math.PI/3;
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*s,Math.sin(a)*s);ctx.stroke();
        ctx.beginPath();ctx.moveTo(Math.cos(a)*s*.5,Math.sin(a)*s*.5);ctx.lineTo(Math.cos(a+.5)*s*.7,Math.sin(a+.5)*s*.7);ctx.stroke();
        ctx.beginPath();ctx.moveTo(Math.cos(a)*s*.5,Math.sin(a)*s*.5);ctx.lineTo(Math.cos(a-.5)*s*.7,Math.sin(a-.5)*s*.7);ctx.stroke()}break;
      case'n':ctx.font=s*2+'px serif';ctx.fillText('♪',-s*.5,s*.5);break;
      case'bf':{const w=s*.8;ctx.beginPath();ctx.ellipse(-w*.4,-w*.2,w,w*.7,-.3,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(w*.4,-w*.2,w,w*.7,.3,0,Math.PI*2);ctx.fill();ctx.fillRect(-1,-w*.3,2,w);break}
      case'bu':ctx.strokeStyle=this.col;ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);ctx.stroke();
        ctx.beginPath();ctx.arc(-s*.3,-s*.3,s*.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.4)';ctx.fill();break;
      case'dr':ctx.beginPath();ctx.moveTo(0,-s*1.2);ctx.bezierCurveTo(s*.6,-s*.3,s*.6,s*.5,0,s);
        ctx.bezierCurveTo(-s*.6,s*.5,-s*.6,-s*.3,0,-s*1.2);ctx.fill();break;
      case'pe':ctx.beginPath();ctx.ellipse(0,0,s*.5,s,0,0,Math.PI*2);ctx.fill();break;
      case'ri':ctx.strokeStyle=this.col;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,s*this.l*3,0,Math.PI*2);ctx.stroke();break;
      case'sp':ctx.beginPath();for(let i=0;i<4;i++){const a=i*Math.PI/2;ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*s,Math.sin(a)*s);
        ctx.lineTo(Math.cos(a+.2)*s*.3,Math.sin(a+.2)*s*.3)}ctx.fill();break;
case'fl':ctx.beginPath();ctx.moveTo(0,-s);ctx.bezierCurveTo(s*.5,-s*.3,s*.4,s*.5,0,s*.8);
        ctx.bezierCurveTo(-s*.4,s*.5,-s*.5,-s*.3,0,-s);ctx.fill();break;
      case'st':ctx.strokeStyle=this.col;ctx.lineWidth=2;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(-this.vx*3,-this.vy*3);ctx.lineTo(0,0);ctx.stroke();
        ctx.beginPath();ctx.arc(0,0,s*.5,0,Math.PI*2);ctx.fill();break;
    }ctx.restore()}
}

function gInput(m){
  const exp=gS.seq[gS.inp.length];
  gS.inp.push(m);updP();
  if(m!==exp){toast('Wrong note!','err');setTimeout(()=>{gS.rnd=0;gS.seq=[];gS.inp=[];gS.started=false;gS.lis=false;gS.score=0;updP()},800);return}
  if(gS.inp.length===gS.seq.length){
    gS.score+=gS.seq.length*10;toast('Correct! +'+gS.seq.length*10,'suc');
    setTimeout(()=>gNext(),800)
  }
}
function gNext(){gS.rnd++;gS.seq.push((bO+2)*12+[0,2,4,5,7,9,11][Math.floor(Math.random()*7)]);
  gS.inp=[];gS.lis=true;updP();
  let t=0;gS.seq.forEach((m,i)=>{setTimeout(()=>{const k=fK(m);if(k){k.el.classList.add('hl');playN(m);spEfx(k);setTimeout(()=>k.el.classList.remove('hl'),300)}else playN(m)},t);t+=500});
  setTimeout(()=>{gS.lis=false;updP()},t+200)
}

// ===== PANEL EVENTS =====
function attPE(){
  // Songs
  document.querySelectorAll('.sc').forEach(c=>c.onclick=()=>{const i=+c.dataset.si;if(songPl===i)stopSong();else{bO=3;buildP();updP();playSong(i)}});
  // Game
  const gs=document.getElementById('gStart');if(gs)gs.onclick=()=>{gNext()};
  const gr=document.getElementById('gRestart');if(gr)gr.onclick=()=>{gS={seq:[],inp:[],rnd:0,score:0,lis:false,started:false};updP()};
  // Compose
  const cr=document.getElementById('cRec');if(cr)cr.onclick=()=>{if(!isComp){isComp=true;cNotes=[];rStart=Date.now()}else{isComp=false}updP()};
  const cp=document.getElementById('cPlay');if(cp)cp.onclick=()=>{if(cNotes.length===0)return;let t=0;
    cNotes.forEach((n,i)=>{const next=cNotes[i+1];const dur=next?next.time-n.time:400;
      setTimeout(()=>{const k=fK(n.midi);if(k){k.el.classList.add('hl');playN(n.midi);spEfx(k);setTimeout(()=>k.el.classList.remove('hl'),dur*.8)}else playN(n.midi)},t);t+=dur})};
  const cc=document.getElementById('cClr');if(cc)cc.onclick=()=>{cNotes=[];isComp=false;updP()};
  const cs=document.getElementById('cSave');if(cs)cs.onclick=()=>{if(cNotes.length===0)return;const nm=document.getElementById('cName').value.trim()||'My Song';
    SONGS.push({name:nm,comp:'You',notes:cNotes.map(n=>({m:n.midi,d:Math.max(200,n.time-(cNotes[cNotes.indexOf(n)-1]?.time||0))}))});
    toast('Song saved!','suc');cNotes=[];isComp=false;updP()};
  // Lessons
  const lp=document.getElementById('lPrev');if(lp)lp.onclick=()=>{if(lesIdx>0){lesIdx--;updP();hlLes()}};
  const ln=document.getElementById('lNext');if(ln)ln.onclick=()=>{if(lesIdx<LESSONS.length-1){lesIdx++;updP();hlLes()}else toast('All lessons completed!','suc')};
}

// ===== MODE SWITCHING =====
document.getElementById('mt').addEventListener('click',e=>{
  const btn=e.target.closest('button');if(!btn)return;
  document.querySelectorAll('.mtabs button').forEach(b=>b.classList.remove('act'));btn.classList.add('act');
  cMode=btn.dataset.m;stopSong();gS={seq:[],inp:[],rnd:0,score:0,lis:false,started:false};
isComp=false;cNotes=[];keys.forEach(k=>k.el.classList.remove('hl'));updP();
  if(cMode==='lessons')hlLes()
});

// ===== EFFECT SELECT =====
document.getElementById('efx').onchange=e=>{cEfx=e.target.value};

// ===== RECORDING =====
document.getElementById('recB').onclick=()=>{
  if(!isRec){isRec=true;rec=[];rStart=Date.now();document.getElementById('recB').classList.add('rec');
    document.getElementById('clrB').disabled=true;document.getElementById('revB').disabled=true;
    rTmr=setInterval(()=>{const s=Math.floor((Date.now()-rStart)/1000);
      document.getElementById('recT').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},200)
  }else{isRec=false;clearInterval(rTmr);document.getElementById('recB').classList.remove('rec');
    document.getElementById('clrB').disabled=rec.length===0;document.getElementById('revB').disabled=rec.length===0}
};
document.getElementById('revB').onclick=()=>{
  if(isRev||rec.length===0)return;isRev=true;document.getElementById('spB').style.display='flex';
  document.getElementById('revB').innerHTML='<i class="fas fa-stop"></i> Stop';
  let t=0;const revTO=[];
  rec.forEach((n,i)=>{const next=rec[i+1];const dur=next?next.time-n.time:400;
    revTO.push(setTimeout(()=>{const k=fK(n.midi);if(k){k.el.classList.add('hl');playN(n.midi);spEfx(k);setTimeout(()=>k.el.classList.remove('hl'),Math.min(dur*.8/revSpd,300))}else playN(n.midi)},t/revSpd));t+=dur});
  revTO.push(setTimeout(()=>{isRev=false;document.getElementById('spB').style.display='none';
    document.getElementById('revB').innerHTML='<i class="fas fa-play"></i> Review';toast('Review done!','inf')},t/revSpd+100));
  // Store for stop
  window._revTO=revTO
};
document.getElementById('clrB').onclick=()=>{rec=[];document.getElementById('recT').textContent='00:00';
  document.getElementById('clrB').disabled=true;document.getElementById('revB').disabled=true;toast('Recording cleared','inf')};
document.getElementById('spB').addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;
  document.querySelectorAll('#spB button').forEach(b=>b.classList.remove('act'));btn.classList.add('act');
  revSpd=parseFloat(btn.dataset.s)});

// ===== TOAST =====
function toast(msg,type='inf'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),2200)}

// ===== INIT =====
buildP();
updP();
</script>
</body>
