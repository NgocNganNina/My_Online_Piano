<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmony — Online Piano</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#1a1510;--fg:#f5ede0;--muted:#8a7e6b;--accent:#c9a84c;--card:#2a2318;--border:#3d3428;--glow:rgba(201,168,76,0.25)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden;position:relative}
h1,h2,h3{font-family:'Cormorant Garamond',serif}
.ambient-blob{position:fixed;border-radius:50%;filter:blur(100px);opacity:.12;pointer-events:none;z-index:0}
.blob-1{width:350px;height:350px;background:#c9a84c;top:5%;left:8%;animation:bfloat 20s ease-in-out infinite alternate}
.blob-2{width:280px;height:280px;background:#8b5a2b;top:55%;right:10%;animation:bfloat 26s ease-in-out infinite alternate-reverse}
.blob-3{width:220px;height:220px;background:#d4a76a;bottom:15%;left:35%;animation:bfloat 30s ease-in-out infinite alternate;animation-delay:-8s}
@keyframes bfloat{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.1)}100%{transform:translate(-20px,15px) scale(.95)}}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;background:rgba(26,21,16,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:700;color:var(--accent);letter-spacing:2px}
.mode-tabs{display:flex;gap:4px;flex-wrap:wrap}
.mode-tabs button{background:transparent;color:var(--muted);border:1px solid transparent;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.85rem;font-family:'Source Sans 3',sans-serif;transition:all .2s}
.mode-tabs button:hover{color:var(--fg);background:rgba(201,168,76,.08)}
.mode-tabs button.active{color:var(--accent);border-color:var(--accent);background:rgba(201,168,76,.1)}
.ctrl-group{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctrl-group label{color:var(--muted);font-size:.8rem}
.ctrl-group select,.ctrl-group button{background:var(--card);color:var(--fg);border:1px solid var(--border);padding:5px 10px;border-radius:6px;font-size:.8rem;cursor:pointer;font-family:'Source Sans 3',sans-serif}
.ctrl-group select:focus,.ctrl-group button:focus{outline:none;border-color:var(--accent)}
.oct-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0!important;font-size:.9rem!important}
main{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:30px 20px 10px}
.piano-wrapper{transform-origin:top center}
.piano-body{background:linear-gradient(180deg,#2a1f14 0%,#1e1812 30%,#1a1410 100%);border:2px solid #3d2e1e;border-radius:10px 10px 14px 14px;box-shadow:0 12px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(201,168,76,.15),0 0 100px rgba(201,168,76,.04);padding:18px 18px 28px;position:relative}
.piano-body::before{content:'';position:absolute;top:-1px;left:20px;right:20px;height:3px;background:linear-gradient(90deg,transparent,#c9a84c,#e8d5a0,#c9a84c,transparent);border-radius:3px}
.piano-body::after{content:'';position:absolute;top:6px;left:30px;right:30px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.2),transparent)}
.keys-area{position:relative;display:flex}
#fxCanvas{position:absolute;top:0;left:0;pointer-events:none;z-index:10}
.white-key{width:48px;height:185px;background:linear-gradient(180deg,#f8f4ec 0%,#f0ece4 55%,#e8e4dc 100%);border:1px solid #c8c3b8;border-top:none;border-radius:0 0 5px 5px;box-shadow:0 5px 8px rgba(0,0,0,.15),inset 0 -3px 4px rgba(0,0,0,.04),-1px 0 0 rgba(0,0,0,.08),1px 0 0 rgba(0,0,0,.08);position:relative;cursor:pointer;transition:transform .04s,box-shadow .04s,background .04s;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;user-select:none}
.white-key:hover:not(.active){background:linear-gradient(180deg,#f2eee6 0%,#eae6de 55%,#e2ded6 100%);box-shadow:0 3px 5px rgba(0,0,0,.12),inset 0 -2px 3px rgba(0,0,0,.03)}
.white-key.active{transform:translateY(3px);box-shadow:0 2px 3px rgba(0,0,0,.2),inset 0 1px 3px rgba(0,0,0,.08);background:linear-gradient(180deg,#ece8e0 0%,#e4e0d8 100%)}
.white-key.highlight{background:linear-gradient(180deg,rgba(201,168,76,.35) 0%,rgba(201,168,76,.18) 100%)!important;box-shadow:0 0 20px rgba(201,168,76,.35),0 4px 8px rgba(0,0,0,.15)!important}
.black-key{width:32px;height:120px;background:linear-gradient(180deg,#303030 0%,#1a1a1a 35%,#111 100%);border-radius:0 0 4px 4px;box-shadow:0 5px 10px rgba(0,0,0,.45),inset 0 -4px 5px rgba(0,0,0,.3),inset 0 1px 2px rgba(255,255,255,.08);position:absolute;top:0;z-index:2;cursor:pointer;transition:transform .04s,box-shadow .04s,height .04s;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;user-select:none}
.black-key:hover:not(.active){background:linear-gradient(180deg,#383838 0%,#222 35%,#181818 100%)}
.black-key.active{transform:translateY(3px);height:117px;box-shadow:0 2px 4px rgba(0,0,0,.35),inset 0 1px 2px rgba(255,255,255,.05)}
.black-key.highlight{background:linear-gradient(180deg,rgba(201,168,76,.55) 0%,rgba(201,168,76,.35) 100%)!important;box-shadow:0 0 18px rgba(201,168,76,.4)!important}
.key-label{font-size:.6rem;font-weight:600;opacity:.45;pointer-events:none;text-transform:uppercase;line-height:1}
.white-key .key-label{color:#5a5347}
.black-key .key-label{color:rgba(255,255,255,.4)}
.key-star{font-size:7px;pointer-events:none;animation:starpulse 2.5s ease-in-out infinite;margin-top:2px}
.white-key .key-star{color:rgba(201,168,76,.5)}
.black-key .key-star{color:rgba(255,255,255,.35)}
@keyframes starpulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:.8;transform:scale(1.25)}}
#panel{padding:16px 28px;min-height:140px;max-height:240px;overflow-y:auto;border-top:1px solid var(--border);background:rgba(26,21,16,.6);backdrop-filter:blur(8px)}
#panel::-webkit-scrollbar{width:6px}
#panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
footer{padding:10px 28px 16px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--border);background:rgba(26,21,16,.8);backdrop-filter:blur(8px)}
.rec-btn{padding:6px 16px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--fg);cursor:pointer;font-size:.82rem;font-family:'Source Sans 3',sans-serif;transition:all .2s;display:flex;align-items:center;gap:6px}
.rec-btn:hover{border-color:var(--accent);color:var(--accent)}
.rec-btn.recording{border-color:#e74c3c;color:#e74c3c;animation:recblink 1s ease-in-out infinite}
@keyframes recblink{0%,100%{opacity:1}50%{opacity:.5}}
.rec-time{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;min-width:50px}
.speed-btns{display:flex;gap:4px}
.speed-btns button{padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:.75rem;font-family:'Source Sans 3',sans-serif;transition:all .15s}
.speed-btns button.active{color:var(--accent);border-color:var(--accent)}
.song-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.song-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all .2s}
.song-card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 15px rgba(0,0,0,.3)}
.song-card.playing{border-color:var(--accent);background:rgba(201,168,76,.08)}
.song-card h3{font-size:1rem;font-weight:600;color:var(--fg);margin-bottom:4px}
.song-card p{font-size:.75rem;color:var(--muted)}
.game-panel{text-align:center}
.game-panel .score{font-size:2rem;font-family:'Cormorant Garamond',serif;color:var(--accent);font-weight:700}
.game-panel .round{color:var(--muted);font-size:.9rem}
.game-panel .status{font-size:1.1rem;margin:12px 0;min-height:30px}
.game-panel .seq-display{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.game-panel .seq-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .2s}
.game-panel .seq-dot.correct{background:#27ae60;border-color:#27ae60}
.game-panel .seq-dot.wrong{background:#e74c3c;border-color:#e74c3c}
.game-panel .seq-dot.current{border-color:var(--accent);box-shadow:0 0 8px var(--glow)}
.compose-panel .note-list{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0;max-height:80px;overflow-y:auto;padding:8px;background:rgba(0,0,0,.2);border-radius:6px}
.compose-panel .note-tag{padding:2px 8px;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.3);border-radius:4px;font-size:.7rem;color:var(--accent)}
.lesson-panel h3{color:var(--accent);font-size:1.2rem;margin-bottom:8px}
.lesson-panel p{color:var(--fg);font-size:.9rem;line-height:1.6;margin-bottom:10px}
.lesson-panel .lesson-nav{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.lesson-panel button{padding:6px 16px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--fg);cursor:pointer;font-size:.82rem;font-family:'Source Sans 3',sans-serif;transition:all .2s}
.lesson-panel button:hover{border-color:var(--accent);color:var(--accent)}
.lesson-panel button:disabled{opacity:.3;cursor:default}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 24px;border-radius:8px;font-size:.85rem;z-index:100;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:rgba(39,174,96,.9);color:#fff}
.toast.error{background:rgba(231,76,60,.9);color:#fff}
.toast.info{background:rgba(201,168,76,.9);color:#1a1510}
.progress-bar{width:100%;height:4px;background:var(--border);border-radius:2px;margin-top:10px;overflow:hidden}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
@media(prefers-reduced-motion:reduce){.ambient-blob,.key-star{animation:none!important}.white-key,.black-key{transition:none!important}}
@media(max-width:1100px){.piano-wrapper{transform:scale(.75)}.keys-area{transform-origin:top left}}
@media(max-width:800px){.piano-wrapper{transform:scale(.55)}header{padding:10px 14px}.mode-tabs button{padding:4px 8px;font-size:.75rem}}
</style>
</head>
<body>
<div class="ambient-blob blob-1"></div>
<div class="ambient-blob blob-2"></div>
<div class="ambient-blob blob-3"></div>
<div id="app">
<header>
  <div class="logo">Harmony</div>
  <nav class="mode-tabs" id="modeTabs">
    <button class="active" data-mode="free"><i class="fas fa-music"></i> Free Play</button>
    <button data-mode="songs"><i class="fas fa-list"></i> Songs</button>
    <button data-mode="game"><i class="fas fa-gamepad"></i> Mini-Game</button>
    <button data-mode="compose"><i class="fas fa-pen-nib"></i> Compose</button>
    <button data-mode="lessons"><i class="fas fa-graduation-cap"></i> Lessons</button>
  </nav>
  <div class="ctrl-group">
    <label>Effect:</label>
    <select id="effectSelect">
      <option value="none">None</option>
      <option value="fireworks">Fireworks</option>
      <option value="hearts">Hearts</option>
      <option value="diamonds">Diamonds</option>
      <option value="shootingstars">Shooting Stars</option>
      <option value="random">Random</option>
      <option value="bubbles">Bubbles</option>
      <option value="leaves">Autumn Leaves</option>
      <option value="rain">Raindrops</option>
      <option value="snow">Snowflakes</option>
      <option value="notes">Musical Notes</option>
      <option value="butterflies">Butterflies</option>
      <option value="fireflies">Fireflies</option>
      <option value="blossoms">Cherry Blossoms</option>
      <option value="ripples">Water Ripples</option>
      <option value="sparkles">Sparkles</option>
      <option value="flames">Flames</option>
      <option value="stars">Golden Stars</option>
    </select>
    <label>Octave:</label>
    <button class="oct-btn" id="octDown"><i class="fas fa-chevron-left"></i></button>
    <span id="octLabel" style="color:var(--accent);font-size:.85rem;min-width:60px;text-align:center">C3 – B5</span>
    <button class="oct-btn" id="octUp"><i class="fas fa-chevron-right"></i></button>
  </div>
</header>
<main>
  <div class="piano-wrapper">
    <div class="piano-body">
      <div class="keys-area" id="keysArea">
        <canvas id="fxCanvas"></canvas>
      </div>
    </div>
  </div>
</main>
<section id="panel"></section>
<footer>
  <button class="rec-btn" id="recBtn"><i class="fas fa-circle" style="font-size:.6rem;color:#e74c3c"></i> Record</button>
  <span class="rec-time" id="recTime">00:00</span>
  <button class="rec-btn" id="reviewBtn" disabled><i class="fas fa-play"></i> Review</button>
  <div class="speed-btns" id="speedBtns" style="display:none">
    <button data-speed="0.5">0.5x</button>
    <button data-speed="1" class="active">1x</button>
    <button data-speed="2">2x</button>
    <button data-speed="4">4x</button>
  </div>
  <button class="rec-btn" id="clearBtn" disabled><i class="fas fa-trash"></i> Clear</button>
</footer>
</div>
<div class="toast" id="toast"></div>

<script>
// ========== CONSTANTS ==========
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const WHITE_IDX = [0,2,4,5,7,9,11]; // C D E F G A B
const BLACK_IDX = [1,3,6,8,10]; // C# D# F# G# A#
const BLACK_POS = [0,1,3,4,5]; // position relative to white keys within octave
const WK_W = 48, WK_H = 185, BK_W = 32, BK_H = 120;
const EFFECT_NAMES = ['fireworks','hearts','diamonds','shootingstars','bubbles','leaves','rain','snow','notes','butterflies','fireflies','blossoms','ripples','sparkles','flames','stars'];

// Keyboard mapping: keyboard key → {octaveOffset, noteIndex}
// Lower octave: ZXCVBNM white, SD_GHJ black
// Upper octave: QWERTYU white, 23567_90 black
// A → middle C (special)
const KB_MAP = {
  'z':{o:0,n:0},'s':{o:0,n:1},'x':{o:0,n:2},'d':{o:0,n:3},'c':{o:0,n:4},
  'v':{o:0,n:5},'g':{o:0,n:6},'b':{o:0,n:7},'h':{o:0,n:8},'n':{o:0,n:9},'j':{o:0,n:10},'m':{o:0,n:11},
  'q':{o:1,n:0},'2':{o:1,n:1},'w':{o:1,n:2},'3':{o:1,n:3},'e':{o:1,n:4},
  'r':{o:1,n:5},'5':{o:1,n:6},'t':{o:1,n:7},'6':{o:1,n:8},'y':{o:1,n:9},'7':{o:1,n:10},'u':{o:1,n:11},
  'i':{o:2,n:0},'9':{o:2,n:1},'o':{o:2,n:2},'0':{o:2,n:3},'p':{o:2,n:4},
  'a':{o:1,n:0} // A = Do = C of middle octave
};

// Reverse map: midi → keyboard label
const MIDI_TO_KB = {};
Object.entries(KB_MAP).forEach(([k,v])=>{
  // Will be populated after baseOctave is set
});

function midiFor(offset, noteIdx) {
  return (baseOctave + offset + 1) * 12 + noteIdx;
}
function midiToName(m) {
  const o = Math.floor(m / 12) - 1;
  return NOTE_NAMES[m % 12] + o;
}
function isBlack(m) { return [1,3,6,8,10].includes(m % 12); }

// ========== STATE ==========
let baseOctave = 3;
let currentMode = 'free';
let currentEffect = 'none';
let audioCtx = null;
let keys = []; // {midi, el, isBlack, x, y, w, h}
let activeKeys = new Set();
let particles = [];
let recording = [];
let isRecording = false;
let recStart = 0;
let recTimer = null;
let reviewSpeed = 1;
let isReviewing = false;
let songPlaying = null;
let songTimeouts = [];

// Game state
let gameState = { sequence:[], input:[], round:0, score:0, listening:false, started:false };

// Compose state
let composeNotes = [];
let isComposing = false;

// Lesson state
let lessonIdx = 0;

// ========== AUDIO ENGINE ==========
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playNoteSound(midi, dur = 1.8) {
  ensureAudio();
  const freq = 440 * Math.pow(2, (midi - 69) / 12);
  const now = audioCtx.currentTime;
  const master = audioCtx.createGain();
  // Compressor for overall level
  if (!window._comp) {
    window._comp = audioCtx.createDynamicsCompressor();
    window._comp.connect(audioCtx.destination);
  }
  master.connect(window._comp);
  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(0.22, now + 0.006);
  master.gain.setTargetAtTime(0.10, now + 0.006, 0.08);
  master.gain.setTargetAtTime(0.0001, now + dur * 0.6, dur * 0.25);
  // Harmonics for richer tone
  const partials = [{r:1,g:1},{r:2,g:.45},{r:3,g:.18},{r:4,g:.07},{r:5,g:.03},{r:6,g:.015}];
  partials.forEach(p => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = midi < 45 ? 'triangle' : 'sine';
    osc.frequency.setValueAtTime(Math.max(20, freq * p.r), now);
    osc.detune.setValueAtTime((Math.random() - 0.5) * 3, now);
    g.gain.setValueAtTime(p.g * 0.18, now);
    g.gain.setTargetAtTime(0.0001, now + dur * 0.4, dur * 0.2);
    osc.connect(g);
    g.connect(master);
    osc.start(now);
    osc.stop(now + dur);
  });
}

// ========== PIANO RENDERING ==========
const keysArea = document.getElementById('keysArea');
const fxCanvas = document.getElementById('fxCanvas');
const fxCtx = fxCanvas.getContext('2d');

function buildPiano() {
  // Clear
  keysArea.querySelectorAll('.white-key,.black-key').forEach(e => e.remove());
  keys = [];
  // Build reverse KB map
  Object.keys(MIDI_TO_KB).forEach(k => delete MIDI_TO_KB[k]);
  Object.entries(KB_MAP).forEach(([k,v]) => {
    const m = midiFor(v.o, v.n);
    if (!MIDI_TO_KB[m]) MIDI_TO_KB[m] = [];
    if (!MIDI_TO_KB[m].includes(k.toUpperCase())) MIDI_TO_KB[m].push(k.toUpperCase());
  });
  // 3 octaves
  const startMidi = (baseOctave + 1) * 12;
  const endMidi = startMidi + 36;
  let whiteCount = 0;
  // First pass: white keys
  for (let m = startMidi; m < endMidi; m++) {
    if (!isBlack(m)) {
      const el = document.createElement('div');
      el.className = 'white-key';
      el.dataset.midi = m;
      const labels = MIDI_TO_KB[m] || [];
      const lbl = labels.length ? labels.join('/') : '';
      el.innerHTML = `<span class="key-label">${lbl}</span><span class="key-star">★</span>`;
      keysArea.appendChild(el);
      keys.push({ midi: m, el, isBlack: false, x: whiteCount * WK_W, y: 0, w: WK_W, h: WK_H });
      whiteCount++;
    }
  }
  // Second pass: black keys
  let wIdx = 0;
  for (let oct = 0; oct < 3; oct++) {
    const octMidi = startMidi + oct * 12;
    BLACK_POS.forEach((pos, i) => {
      const m = octMidi + BLACK_IDX[i];
      if (m < endMidi) {
        const el = document.createElement('div');
        el.className = 'black-key';
        el.dataset.midi = m;
        const labels = MIDI_TO_KB[m] || [];
        const lbl = labels.length ? labels.join('/') : '';
        el.innerHTML = `<span class="key-label">${lbl}</span><span class="key-star">★</span>`;
        const left = (wIdx + pos + 1) * WK_W - BK_W / 2;
        el.style.left = left + 'px';
        keysArea.appendChild(el);
        keys.push({ midi: m, el, isBlack: true, x: left, y: 0, w: BK_W, h: BK_H });
      }
    });
    wIdx += 7;
  }
  // Size canvas
  fxCanvas.width = whiteCount * WK_W;
  fxCanvas.height = WK_H;
  fxCanvas.style.width = fxCanvas.width + 'px';
  fxCanvas.style.height = fxCanvas.height + 'px';
  // Update label
  document.getElementById('octLabel').textContent = `C${baseOctave} – B${baseOctave+2}`;
  // Attach mouse/touch events
  keys.forEach(k => {
    k.el.addEventListener('mousedown', e => { e.preventDefault(); triggerKey(k.midi, true); });
    k.el.addEventListener('mouseup', () => triggerKey(k.midi, false));
    k.el.addEventListener('mouseleave', () => { if (activeKeys.has(k.midi)) triggerKey(k.midi, false); });
    k.el.addEventListener('touchstart', e => { e.preventDefault(); triggerKey(k.midi, true); }, {passive:false});
    k.el.addEventListener('touchend', e => { e.preventDefault(); triggerKey(k.midi, false); });
  });
}

function findKey(midi) { return keys.find(k => k.midi === midi); }

// ========== INPUT HANDLING ==========
function triggerKey(midi, down) {
  const k = findKey(midi);
  if (!k) return;
  if (down && !activeKeys.has(midi)) {
    activeKeys.add(midi);
    k.el.classList.add('active');
    playNoteSound(midi);
    spawnEffect(k);
    if (isRecording) recording.push({ midi, time: Date.now() - recStart });
    if (isComposing) composeNotes.push({ midi, time: Date.now() - recStart });
    // Game input
    if (currentMode === 'game' && gameState.listening === false && gameState.started) {
      handleGameInput(midi);
    }
    // Lesson check
    if (currentMode === 'lessons') checkLessonInput(midi);
  } else if (!down && activeKeys.has(midi)) {
    activeKeys.delete(midi);
    k.el.classList.remove('active');
  }
}

const pressedKB = new Set();
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  const key = e.key.toLowerCase();
  if (KB_MAP[key] && !pressedKB.has(key)) {
    pressedKB.add(key);
    const m = midiFor(KB_MAP[key].o, KB_MAP[key].n);
    triggerKey(m, true);
  }
});
document.addEventListener('keyup', e => {
  const key = e.key.toLowerCase();
  if (KB_MAP[key]) {
    pressedKB.delete(key);
    const m = midiFor(KB_MAP[key].o, KB_MAP[key].n);
    triggerKey(m, false);
  }
});

// Octave controls
document.getElementById('octDown').addEventListener('click', () => { if (baseOctave > 0) { baseOctave--; stopAll(); buildPiano(); }});
document.getElementById('octUp').addEventListener('click', () => { if (baseOctave < 6) { baseOctave++; stopAll(); buildPiano(); }});

function stopAll() {
  activeKeys.forEach(m => { const k = findKey(m); if (k) k.el.classList.remove('active'); });
  activeKeys.clear();
  pressedKB.clear();
  songTimeouts.forEach(t => clearTimeout(t));
  songTimeouts = [];
  songPlaying = null;
}

// ========== EFFECTS SYSTEM ==========
class Particle {
  constructor(x, y, cfg) {
    this.x = x; this.y = y;
    this.vx = cfg.vx || 0; this.vy = cfg.vy || 0;
    this.size = Math.max(1, cfg.size || 5);
    this.color = cfg.color || '#c9a84c';
    this.alpha = cfg.alpha || 1;
    this.decay = cfg.decay || 0.02;
    this.gravity = cfg.gravity || 0;
    this.life = 1;
    this.shape = cfg.shape || 'circle';
    this.rot = cfg.rot || 0;
    this.rotSpd = cfg.rotSpd || 0;
    this.wobble = cfg.wobble || 0;
    this.wobbleSpd = cfg.wobbleSpd || 0;
    this.t = 0;
  }
  update() {
    this.t++;
    this.x += this.vx + (this.wobble ? Math.sin(this.t * this.wobbleSpd) * this.wobble : 0);
    this.y += this.vy;
    this.vy += this.gravity;
    this.life -= this.decay;
    this.alpha = Math.max(0, this.life);
    this.rot += this.rotSpd;
    return this.life > 0;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.fillStyle = this.color;
    const s = this.size;
    switch(this.shape) {
      case 'circle':
        ctx.beginPath(); ctx.arc(0,0,s,0,Math.PI*2); ctx.fill(); break;
      case 'heart':
        ctx.beginPath();
        ctx.moveTo(0, s*0.3);
        ctx.bezierCurveTo(0,0,-s*0.5,0,-s*0.5,s*0.3);
        ctx.bezierCurveTo(-s*0.5,s*0.6,0,s*0.8,0,s);
        ctx.bezierCurveTo(0,s*0.8,s*0.5,s*0.6,s*0.5,s*0.3);
        ctx.bezierCurveTo(s*0.5,0,0,0,0,s*0.3);
        ctx.fill(); break;
      case 'diamond':
        ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s*0.6,0); ctx.lineTo(0,s); ctx.lineTo(-s*0.6,0); ctx.closePath(); ctx.fill(); break;
      case 'star': {
        ctx.beginPath();
        for(let i=0;i<5;i++){
          const a = (i*4*Math.PI/5)-Math.PI/2;
          const r = i===0?s:0;
          if(i===0)ctx.moveTo(Math.cos(a)*s,Math.sin(a)*s);
          else{
            const a1=(i*4*Math.PI/5)-Math.PI/2;
            const a0=((i-1)*4*Math.PI/5)-Math.PI/2;
            ctx.lineTo(Math.cos((a0+a1)/2)*s*0.4,Math.sin((a0+a1)/2)*s*0.4);
            ctx.lineTo(Math.cos(a1)*s,Math.sin(a1)*s);
          }
        }
        ctx.closePath(); ctx.fill(); break;
      }
      case 'leaf':
        ctx.beginPath();
        ctx.moveTo(0,-s);
        ctx.bezierCurveTo(s*0.8,-s*0.5,s*0.8,s*0.5,0,s);
        ctx.bezierCurveTo(-s*0.8,s*0.5,-s*0.8,-s*0.5,0,-s);
        ctx.fill(); break;
      case 'snowflake':
        ctx.strokeStyle = this.color; ctx.lineWidth = 1.5;
        for(let i=0;i<6;i++){
          const a=i*Math.PI/3;
          ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*s,Math.sin(a)*s);ctx.stroke();
          ctx.beginPath();ctx.moveTo(Math.cos(a)*s*0.5,Math.sin(a)*s*0.5);
          ctx.lineTo(Math.cos(a+0.5)*s*0.7,Math.sin(a+0.5)*s*0.7);ctx.stroke();
          ctx.beginPath();ctx.moveTo(Math.cos(a)*s*0.5,Math.sin(a)*s*0.5);
          ctx.lineTo(Math.cos(a-0.5)*s*0.7,Math.sin(a-0.5)*s*0.7);ctx.stroke();
        }
        break;
      case 'note':
        ctx.font = `${s*2}px serif`; ctx.fillText('♪',-s*0.5,s*0.5); break;
      case 'butterfly': {
        const wing = s * 0.8;
        ctx.beginPath();
        ctx.ellipse(-wing*0.4, -wing*0.2, wing, wing*0.7, -0.3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath();
        ctx.ellipse(wing*0.4, -wing*0.2, wing, wing*0.7, 0.3, 0, Math.PI*2); ctx.fill();
        ctx.fillRect(-1, -wing*0.3, 2, wing);
        break;
      }
      case 'bubble':
        ctx.strokeStyle = this.color; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0,0,s,0,Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(-s*0.3,-s*0.3,s*0.2,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fill();
        break;
      case 'drop':
        ctx.beginPath();
        ctx.moveTo(0,-s*1.2);
        ctx.bezierCurveTo(s*0.6,-s*0.3,s*0.6,s*0.5,0,s);
        ctx.bezierCurveTo(-s*0.6,s*0.5,-s*0.6,-s*0.3,0,-s*1.2);
        ctx.fill(); break;
      case 'petal':
        ctx.beginPath();
        ctx.ellipse(0,0,s*0.5,s,0,0,Math.PI*2); ctx.fill(); break;
      case 'ripple':
        ctx.strokeStyle = this.color; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0,0,s*this.life*3,0,Math.PI*2); ctx.stroke(); break;
      case 'spark': {
        ctx.beginPath();
        for(let i=0;i<4;i++){
          const a=i*Math.PI/2;
          ctx.moveTo(0,0);
          ctx.lineTo(Math.cos(a)*s,Math.sin(a)*s);
          ctx.lineTo(Math.cos(a+0.2)*s*0.3,Math.sin(a+0.2)*s*0.3);
        }
        ctx.fill(); break;
      }
      case 'flame':
        ctx.beginPath();
        ctx.moveTo(0,-s);
        ctx.bezierCurveTo(s*0.5,-s*0.3,s*0.4,s*0.5,0,s*0.8);
        ctx.bezierCurveTo(-s*0.4,s*0.5,-s*0.5,-s*0.3,0,-s);
        ctx.fill(); break;
      case 'streak':
        ctx.strokeStyle = this.color; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-this.vx*3, -this.vy*3); ctx.lineTo(0,0); ctx.stroke();
        ctx.beginPath(); ctx.arc(0,0,s*0.5,0,Math.PI*2); ctx.fill();
        break;
    }
    ctx.restore();
  }
}

function animateEffects() {
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  particles = particles.filter(p => {
    if (p.update()) { p.draw(fxCtx); return true; }
    return false;
  });
  requestAnimationFrame(animateEffects);
}

// ========== SONG PLAYBACK ==========
function playSong(songIdx) {
  stopAll();
  const song = SONGS[songIdx];
  songPlaying = songIdx;
  let time = 0;
  song.notes.forEach((n, i) => {
    const t = setTimeout(() => {
      // Find key in current view or play sound anyway
      const k = findKey(n.m);
      if (k) {
        k.el.classList.add('highlight');
        playNoteSound(n.m);
        spawnEffect(k);
        setTimeout(() => k.el.classList.remove('highlight'), n.d * 0.8);
      } else {
        playNoteSound(n.m);
      }
      // Update progress
      const pct = ((i + 1) / song.notes.length * 100).toFixed(0);
      const prog = document.querySelector('.progress-bar .fill');
      if (prog) prog.style.width = pct + '%';
    }, time);
    songTimeouts.push(t);
    time += n.d;
  });
  // End
  songTimeouts.push(setTimeout(() => {
    songPlaying = null;
    updatePanel();
    showToast('Song finished!', 'success');
  }, time));
}

function stopSong() {
  songTimeouts.forEach(t => clearTimeout(t));
  songTimeouts = [];
  keys.forEach(k => k.el.classList.remove('highlight'));
  songPlaying = null;
  updatePanel();
}

// ========== MODE PANELS ==========
function updatePanel() {
  const panel = document.getElementById('panel');
  switch(currentMode) {
    case 'free': panel.innerHTML = freePlayPanel(); break;
    case 'songs': panel.innerHTML = songsPanel(); break;
    case 'game': panel.innerHTML = gamePanel(); break;
    case 'compose': panel.innerHTML = composePanel(); break;
    case 'lessons': panel.innerHTML = lessonPanel(); break;
  }
  attachPanelEvents();
}

  return `<div style="text-align:center;padding:10px 0">

function songsPanel() {
  let cards = SONGS.map((s, i) => `
    <div class="song-card ${songPlaying === i ? 'playing' : ''}" data-song="${i}">

function gamePanel() {
  const g = gameState;
  let dots = '';
  for (let i = 0; i < g.sequence.length; i++) {
    let cls = 'seq-dot';
    if (i < g.input.length) cls += g.input[i] === g.sequence[i] ? ' correct' : ' wrong';
    else if (i === g.input.length) cls += ' current';
    dots += `<div class="${cls}"></div>`;
  }
  return `<div class="game-panel">
    <div class="score">${g.score}</div>
    <div class="round">Round ${g.round} &middot; ${g.sequence.length} notes</div>
    <div class="status">${g.started ? (g.listening ? '<span style="color:var(--accent)"><i class="fas fa-ear-listen"></i> Listen carefully...</span>' : '<span style="color:var(--fg)"><i class="fas fa-hand-pointer"></i> Your turn! Play the notes.</span>') : 'Press Start to begin!'}</div>
    <div class="seq-display">${dots || '<span style="color:var(--border);font-size:.8rem">Sequence will appear here</span>'}</div>
    <div style="margin-top:10px">
      ${!g.started ? '<button class="rec-btn" id="gameStart"><i class="fas fa-play"></i> Start Game</button>' : ''}
      ${g.started && !g.listening ? '<button class="rec-btn" id="gameRestart"><i class="fas fa-redo"></i> Restart</button>' : ''}
    </div>
  </div>`;
}
